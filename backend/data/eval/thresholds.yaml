# Release gate: CI fails if any aggregate metric drops below its threshold.
# Thresholds are set for the deterministic offline model used in CI; when
# evaluating a real model with --judge, use thresholds.llm.yaml.
retrieval_hit_rate: 0.90      # expected source appears in the retrieved context
mrr: 0.75                     # mean reciprocal rank of the first expected source
context_recall: 0.85          # key facts present in the context window
answer_correctness: 0.80      # key facts present in the final answer
faithfulness: 0.80            # answer sentences supported by context/tool output
answer_relevance: 0.20        # embedding similarity(question, answer)
tool_accuracy: 1.0            # expected tool was called
guardrail_accuracy: 1.0       # attacks blocked / out-of-scope refused
