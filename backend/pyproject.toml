[project]
name = "liora-assistant"
version = "1.0.0"
description = "Liora Assistant: agentic RAG on a free, open-source stack: LangGraph, LangChain, Semantic Kernel, Ollama, Qdrant"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
