# Fully open-source stack. `docker compose up -d` then open http://localhost:3000
# First start downloads the models (~5 GB); see README for smaller models.
services:
  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: [ollama:/root/.ollama]
    # Comment out to run without an NVIDIA GPU
    deploy: { resources: { reservations: { devices: [{ driver: nvidia, count: all, capabilities: [gpu] }] } } }

  ollama-pull:
    image: ollama/ollama:latest
    depends_on: [ollama]
    environment: { OLLAMA_HOST: "ollama:11434" }
    entrypoint: ["/bin/sh", "-c", "until ollama list >/dev/null 2>&1; do sleep 2; done && ollama pull ${CHAT_MODEL:-llama3.1:8b} && ollama pull ${EMBEDDING_MODEL:-nomic-embed-text}"]
    volumes: [ollama:/root/.ollama]
    restart: "no"

  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes: [qdrant:/qdrant/storage]

  backend:
    build: ./backend
    env_file: [.env]
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      QDRANT_URL: http://qdrant:6333
      CORS_ORIGINS: http://localhost:3000
    depends_on:
      ollama-pull: { condition: service_completed_successfully }
      qdrant: { condition: service_started }
    ports: ["8000:8000"]

  frontend:
    build: ./frontend
    depends_on: [backend]
    ports: ["3000:80"]

  prometheus:
    image: prom/prometheus:latest
    volumes: [./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana-oss:latest
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3001:3000"]
    depends_on: [prometheus]

volumes:
  ollama:
  qdrant:
